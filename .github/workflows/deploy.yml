name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "content/**/*.md"

  build:
    # Forks have no Pages site; deploying (and pinging IndexNow) from one fails or misfires
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    needs: lint
    # Only the deploying job may mint an OIDC token and publish to Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - name: Build
        run: hugo --minify

      # Runs before deploying, while the live sitemap is still the previous version.
      - name: Find changed pages
        run: |
          # Pages that are new or whose <lastmod> (last git commit) differs from the live site
          pages() { grep -o '<loc>[^<]*</loc><lastmod>[^<]*' | sed 's/<loc>//; s/<\/loc><lastmod>/ /' | sort; }
          # Cache-busting query: the Pages CDN caches sitemap.xml for 10 minutes
          if ! curl -fsS "https://lantanomads.com/sitemap.xml?ts=$(date +%s)" -o live-sitemap.xml; then
            echo "::warning::Could not fetch live sitemap, treating every page as changed"
            : > live-sitemap.xml
          fi
          comm -13 <(pages < live-sitemap.xml) <(pages < public/sitemap.xml) | cut -d' ' -f1 > changed-urls.txt
          echo "Changed URLs:"; cat changed-urls.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Submit changed pages to IndexNow
        run: |
          KEY="f9eaa7fef6664212ab3289298a9d8dd0"
          if [ ! -s changed-urls.txt ]; then echo "Nothing changed, skipping IndexNow"; exit 0; fi

          # deploy-pages waits for the deployment, but the CDN can lag. Only ping once
          # the new build is being served (sitemap matches) and the key file is live:
          # Bing caches a failed key check and may crawl stale pages.
          for i in $(seq 1 30); do
            TS=$(date +%s)
            curl -fsS "https://lantanomads.com/sitemap.xml?ts=$TS" -o served-sitemap.xml \
              && cmp -s served-sitemap.xml public/sitemap.xml \
              && [ "$(curl -s "https://lantanomads.com/${KEY}.txt?ts=$TS")" = "$KEY" ] && break
            [ "$i" = 30 ] && { echo "::error::New build or IndexNow key file not live after 5 minutes"; exit 1; }
            sleep 10
          done

          PAYLOAD=$(jq -n --arg key "$KEY" --rawfile urls changed-urls.txt \
            '{host: "lantanomads.com", key: $key, keyLocation: "https://lantanomads.com/\($key).txt",
              urlList: ($urls | split("\n") | map(select(length > 0)))}')
          STATUS=$(curl -s -o response.txt -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$PAYLOAD")
          echo "IndexNow HTTP $STATUS"; cat response.txt
          # 200 = OK, 202 = accepted, key validation pending
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::error::IndexNow HTTP $STATUS $(cat response.txt)"
            exit 1
          fi
