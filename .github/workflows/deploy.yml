name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "content/**/*.md"

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - name: Build
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          KEY="f9eaa7fef6664212ab3289298a9d8dd0"
          # GitHub Pages publishes asynchronously after the gh-pages push.
          # Wait until the key file is live, otherwise IndexNow can't verify it.
          for i in $(seq 1 30); do
            if [ "$(curl -s "https://lantanomads.com/${KEY}.txt")" = "$KEY" ]; then break; fi
            sleep 10
          done
          URL_LIST=$(grep -o '<loc>[^<]*</loc>' ./public/sitemap.xml | sed 's/<[^>]*>//g' | jq -R -s 'split("\n") | map(select(length > 0))')
          PAYLOAD=$(jq -n \
            --arg host "lantanomads.com" \
            --arg key "$KEY" \
            --arg keyLocation "https://lantanomads.com/${KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          STATUS=$(curl -s -o response.txt -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "IndexNow HTTP $STATUS"; cat response.txt
          # 200 = OK, 202 = accepted, key validation pending
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning title=IndexNow failed::HTTP $STATUS $(cat response.txt)"
            exit 1
          fi
