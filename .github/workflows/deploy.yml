name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "content/**/*.md"

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - name: Build
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit changed pages to IndexNow
        run: |
          KEY="f9eaa7fef6664212ab3289298a9d8dd0"
          # Submit only pages that are new or whose <lastmod> (last git commit) differs
          # from the previous deploy. origin/gh-pages is still the pre-deploy version here.
          pages() { grep -o '<loc>[^<]*</loc><lastmod>[^<]*' | sed 's/<loc>//; s/<\/loc><lastmod>/ /' | sort; }
          comm -13 <(git show origin/gh-pages:sitemap.xml | pages) <(pages < public/sitemap.xml) | cut -d' ' -f1 > changed-urls.txt
          echo "Changed URLs:"; cat changed-urls.txt
          if [ ! -s changed-urls.txt ]; then echo "Nothing changed, skipping IndexNow"; exit 0; fi

          # GitHub Pages publishes asynchronously after the gh-pages push. Never ping
          # before the key file is live: Bing caches a failed key check.
          for i in $(seq 1 30); do
            [ "$(curl -s "https://lantanomads.com/${KEY}.txt")" = "$KEY" ] && break
            [ "$i" = 30 ] && { echo "::error::IndexNow key file not live after 5 minutes"; exit 1; }
            sleep 10
          done

          PAYLOAD=$(jq -n --arg key "$KEY" --rawfile urls changed-urls.txt \
            '{host: "lantanomads.com", key: $key, keyLocation: "https://lantanomads.com/\($key).txt",
              urlList: ($urls | split("\n") | map(select(length > 0)))}')
          STATUS=$(curl -s -o response.txt -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$PAYLOAD")
          echo "IndexNow HTTP $STATUS"; cat response.txt
          # 200 = OK, 202 = accepted, key validation pending
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::error::IndexNow HTTP $STATUS $(cat response.txt)"
            exit 1
          fi
